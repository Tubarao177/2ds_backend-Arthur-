<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Wind | Stand Power</title>
    <!-- FontAwesome para os ícones modernos -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Google Fonts temáticas -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Permanent+Marker&family=Impact&family=Poppins:wght@400;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --jojo-pink: #ff007f;
            --jojo-green: #00ff66;
            --jojo-gold: #ffe600;
            --jojo-purple: #3d0066;
            --ink-black: #000000;
            --border-heavy: 5px solid #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--jojo-purple);
            /* Fundo psicodélico de Losangos e Linhas típico da Parte 5 */
            background-image: 
                linear-gradient(45deg, #2a0047 25%, transparent 25%), 
                linear-gradient(-45deg, #2a0047 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #2a0047 75%), 
                linear-gradient(-45deg, transparent 75%, #2a0047 75%);
            background-size: 60px 60px;
            background-position: 0 0, 0 30px, 30px -30px, -30px 0px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 40px 20px;
        }

        /* O Card Principal com contorno de Nanquim */
        .bizarre-card {
            background: var(--jojo-gold);
            padding: 2.5rem 2rem;
            max-width: 440px;
            width: 100%;
            position: relative;
            border: var(--border-heavy);
            box-shadow: 18px 18px 0px var(--ink-black), 0 0 60px rgba(255, 0, 127, 0.5);
            transform: rotate(-1deg);
            transition: transform 0.2s ease;
            z-index: 2;
            margin-top: 60px; /* Espaço para os personagens que sobressaem */
        }

        .bizarre-card:hover {
            transform: rotate(0deg) scale(1.02);
        }

        /* Container de Personagem Duplo (Giorno + Gold Experience) em SVG Base64 */
        .stand-user-combo {
            width: 100%;
            height: 180px;
            margin: -110px auto 1.5rem;
            background-repeat: no-repeat;
            background-position: center bottom;
            background-size: contain;
            /* SVG Base64 contendo a silhueta icônica do Gold Experience à esquerda e Giorno à direita */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://w3.org" viewBox="0 0 200 100"><g id="GoldExperience" transform="translate(15,0)"><path fill="%2300ff66" stroke="%23000" stroke-width="2.5" d="M40,30 C30,10 50,5 60,20 C70,5 90,10 80,30 C90,45 85,75 75,80 C60,85 50,85 45,80 C35,75 30,45 40,30 Z"/><circle cx="50" cy="35" r="5" fill="%23ffe600" stroke="%23000"/><circle cx="70" cy="35" r="5" fill="%23ffe600" stroke="%23000"/><path fill="%23ffe600" stroke="%23000" stroke-width="1.5" d="M55,60 L65,60 L60,80 Z"/></g><g id="GiornoGiovanna" transform="translate(75,15)"><path fill="%23ff007f" stroke="%23000" stroke-width="2.5" d="M40,25 C30,10 15,18 20,32 C8,32 5,45 15,55 C10,65 22,78 35,72 C40,85 55,85 60,72 C72,78 82,65 77,55 C88,45 82,32 72,32 C75,18 60,10 50,25 Z"/><path fill="%23ffe600" d="M40,32 C36,25 46,20 50,28 C54,20 64,25 60,32 Z"/><circle cx="46" cy="58" r="7" fill="%2300ff66" stroke="%23000" stroke-width="2"/></g></svg>');
            filter: drop-shadow(8px 8px 0px var(--ink-black));
            position: relative;
            animation: float 2.5s ease-in-out infinite alternate;
        }

        /* Título Estilo Impacto */
        h3 {
            font-family: 'Impact', sans-serif;
            font-size: 3.2rem;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: -1px;
            -webkit-text-stroke: 3px var(--ink-black);
            text-shadow: 5px 5px 0px var(--jojo-pink);
            transform: skewY(-3deg) scaleY(1.1);
            margin-bottom: 1.5rem;
            line-height: 1;
        }

        /* Balão de Fala Pontiagudo com Frase em Italiano */
        .speech-bubble {
            background: #ffffff;
            color: var(--ink-black);
            padding: 1.2rem 1rem;
            border: var(--border-heavy);
            position: relative;
            font-weight: 900;
            font-size: 1.15rem;
            text-transform: uppercase;
            box-shadow: 6px 6px 0px var(--ink-black);
            margin-bottom: 2.5rem;
            transform: rotate(1deg);
            line-height: 1.3;
        }

        .speech-bubble .translation {
            display: block;
            font-size: 0.8rem;
            color: #555;
            margin-top: 6px;
            font-family: sans-serif;
            font-weight: bold;
        }

        /* Rabicho do balão de mangá */
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 40px;
            border-width: 20px 20px 0 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }
        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -27px;
            left: 37px;
            border-width: 22px 22px 0 0;
            border-style: solid;
            border-color: var(--ink-black) transparent;
            display: block;
            width: 0;
            z-index: -1;
        }

        /* Botão de Rota (Mudado os ícones para armas/luta da Passione) */
        .btn-bizarre {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: var(--jojo-green);
            color: var(--ink-black);
            text-decoration: none;
            padding: 1.2rem;
            border: var(--border-heavy);
            font-family: 'Permanent Marker', cursive;
            font-size: 1.6rem;
            text-transform: uppercase;
            box-shadow: 6px 6px 0px var(--ink-black);
            transition: all 0.1s ease;
            cursor: pointer;
        }

        .btn-bizarre:hover {
            background: var(--jojo-pink);
            color: #ffffff;
            transform: translate(-4px, -4px);
            box-shadow: 10px 10px 0px var(--ink-black);
        }

        .btn-bizarre:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0px var(--ink-black);
        }

        /* Onomatopéias Extras de Soco "MUDA MUDA" */
        .muda-text {
            position: absolute;
            font-family: 'Impact', sans-serif;
            font-size: 3rem;
            color: rgba(0, 255, 102, 0.2);
            -webkit-text-stroke: 1px var(--ink-black);
            font-weight: 900;
            text-transform: uppercase;
            user-select: none;
            pointer-events: none;
        }
        .md-1 { top: 10%; left: 5%; transform: rotate(-15deg); }
        .md-2 { bottom: 15%; right: 5%; transform: rotate(25deg); font-size: 4rem; color: rgba(255, 0, 127, 0.2); }

        /* Kanjis Menacing Gigantes */
        .menacing {
            position: absolute;
            font-family: 'Impact', sans-serif;
            font-size: 6.5rem;
            font-weight: 900;
            -webkit-text-stroke: 2px var(--ink-black);
            user-select: none;
            pointer-events: none;
            animation: pulse 1.5s ease-in-out infinite alternate;
            z-index: 1;
        }
        .m1 { top: -10px; left: -25px; color: var(--jojo-pink); transform: rotate(-20deg); text-shadow: 4px 4px 0 var(--jojo-green); }
        .m2 { bottom: -10px; right: -25px; color: var(--jojo-green); transform: rotate(15deg); text-shadow: 4px 4px 0 var(--jojo-pink); animation-delay: 0.5s; }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-15px) scale(1.03); }
        }

        @keyframes pulse {
            0% { transform: scale(0.9) translateY(0); }
            100% { transform: scale(1.1) translateY(-10px); }
        }
    </style>
</head>
<body>

    <!-- Efeitos de Fundo Decorativos -->
    <div class="menacing m1">ゴ</div>
    <div class="menacing m2">ゴ</div>
    <div class="muda-text md-1">Muda Muda!</div>
    <div class="muda-text md-2">Muda!</div>

    <div class="bizarre-card">
        
        <!-- Combo Giorno Giovanna + Stand Gold Experience embutidos juntos -->
        <div class="stand-user-combo"></div>

        <h3>Página Inicial</h3>
        
        <!-- Balão de Fala em Italiano -->
        <div class="speech-bubble">
            <i class="fa-solid fa-quote-left" style="color: var(--jojo-pink); margin-right: 5px;"></i>
            Benvenuto nella nostra base, sei al sicuro!
            <span class="translation">(Olá, você está em casa!)</span>
        </div>
        
        <!-- Link conectado diretamente para a página sobre_parte4.html -->
        <a href="sobre_parte4.html" class="btn-bizarre">
            <span>viaggio verso il Colosseo!!</span>
            <i class="fa-solid fa-hand-fist"></i>
        </a>
    </div>

</body>
</html>
